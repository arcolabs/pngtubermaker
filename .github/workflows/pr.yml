name: PR

# Pull-request gate: proves install, static checks, production build, and the
# root Docker build (the Zeabur contract) on every exact PR head targeting main.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

# One run per PR head — pushing a new commit cancels the stale run.
concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Static checks (Biome)
        run: bun run check

      - name: Production build
        run: bun run build
        env:
          # Same dummy value the Dockerfile uses for build-time page
          # collection; never used for an actual connection.
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder

      - name: Root Docker build (Zeabur contract)
        run: docker build .
