name: PR

# Pull-request gate: proves install, static checks, production build, and the
# root Docker build (the Zeabur contract) on every exact PR head targeting main.
on:
  pull_request:
    branches: [main]
  # Manual, for the same reason arcops-server's ci.yml has it: main is
  # unprotected, so a direct push lands and deploys with no check having run.
  # The Arcops release path does open PRs (all five pr.yml runs fired on
  # `arcops/gwc_*` branches), but human fixes like this one go straight to main,
  # and dispatch lets a change be proven on demand rather than only when someone
  # happens to open a PR.
  workflow_dispatch:

permissions:
  contents: read

# One run per PR head — pushing a new commit cancels the stale run.
#
# The run_id fallback matters: `github.event.pull_request.number` is empty for a
# workflow_dispatch, and without a fallback every dispatch would share the group
# name `pr-` and cancel each other.
concurrency:
  group: pr-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  verify:
    # Self-hosted, matching arcolabs/arcops-server. This repo is PRIVATE in the
    # same org, and GitHub-hosted minutes here are blocked by the org billing
    # failure documented in arcops-server's ci.yml, so `ubuntu-latest` does not
    # merely cost money - the job never starts and reports "The job was not
    # started because recent account payments have failed". Last green run of
    # this workflow was 2026-09-11, four days BEFORE the 2026-09-15 block, so
    # the ratchet step added on 2026-09-24 has never executed in CI.
    #
    # The org's Default runner group is `visibility: all`, so the `arcops`
    # runner (nab9-arcops-ci, self-hosted/Linux/X64/arcops, online 2026-09-24)
    # is available to this repo without registering one of its own.
    runs-on: arcops
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Static checks (Biome)
        run: bun run check

      - name: Production build
        run: bun run build
        env:
          # Same dummy value the Dockerfile uses for build-time page
          # collection; never used for an actual connection.
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder

      - name: Sitemap coverage ratchet
        # Must run AFTER the production build: it reads the emitted
        # .next/server/app/sitemap.xml.body rather than re-deriving routes, so it
        # checks the artifact that actually ships. Placed before the Docker build
        # to fail fast on the cheaper signal.
        #
        # Fails when a public route ships a page.tsx but is absent from the
        # sitemap (and not in the script's EXCLUDED allowlist). That is the
        # 2026-09-24 defect class: three pages released by the organic Work loop
        # returned 200 with real content but were listed nowhere, so no crawler
        # could ever reach them, and the top-down 2026-09-15 audit could not see
        # them because it enumerated sitemap -> URLs.
        run: bash docs/context/seo-coverage-check.sh

      - name: Root Docker build (Zeabur contract)
        # Same two flags arcops-server needs on this runner, and for the same
        # measured reasons: the daemon's proxy env reaches build steps and breaks
        # them (empty build-args unset the predefined proxy args), and a build
        # container has no DNS of its own on this host so it runs in the host
        # namespace where the resolver works. Retried because the host's
        # connection is residential and has been measured dropping large
        # transfers, so one failure is not a verdict.
        run: |
          for attempt in 1 2 3; do
            if docker build --network host \
              --build-arg HTTP_PROXY= --build-arg HTTPS_PROXY= \
              --build-arg http_proxy= --build-arg https_proxy= \
              -t pngtubermaker-ci .; then
              exit 0
            fi
            echo "docker build attempt $attempt failed; retrying in 15s"
            sleep 15
          done
          echo "docker build failed after 3 attempts"
          exit 1
